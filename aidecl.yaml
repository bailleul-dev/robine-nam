# AI Declaration — https://ai-declaration.org/
# Machine-readable record of how AI tools were used in this project.
# Validate with: make aidecl-check
schema_version: "1.0.0"

project:
  name: robine-nam
  repository: https://github.com/bailleul-dev/robine-nam
  license: MIT
  content_type: software

ai_usage:
  used: true
  level: extensive
  summary: >-
    This project was built with intensive use of an AI coding agent. The
    library (crates/robine-nam), the asset download script, the tests, the
    benchmarks and the documentation were
    written by Claude Code (Anthropic) working interactively under the
    direction of the maintainer, who set the goals, the architecture
    constraints (A2 small/large only, driver-agnostic, allocation-free,
    release-only measurements), reviewed the output and validated the
    results. Correctness was established against the upstream
    NeuralAmpModelerCore reference implementation, which the tools of
    robine-wavelab fetch at a pinned commit and which is not AI-generated
    by this project.
  tools:
    - name: Claude Code
      vendor: Anthropic
      type: agent
      hosting: cloud_vendor
      model: claude-fable-5-1
      purpose:
        - code_generation
        - testing
        - debugging
        - documentation
        - benchmarking
      period:
        start: "2026-10-10"
  activities:
    - code_generation
    - testing
    - debugging
    - refactoring
    - documentation
    - infrastructure
  ai_proportion:
    qualitative: mostly_ai
    ai_generated_percent: 90
    ai_assisted_percent: 5
    human_only_percent: 5
    method: self_reported
  code_proportion:
    ai_generated_percent: 90
    ai_assisted_percent: 5
    human_only_percent: 5
    method: self_reported
    estimation_notes: >-
      Self-assessment of the Rust, C++ and Python sources of this repository,
      excluding the fetched NeuralAmpModelerCore sources and the upstream
      example model used as a test fixture.
  generated_content:
    documentation_percent: 90
    artifacts:
      - README.md
      - BENCH.md
  components:
    - name: crates/robine-nam
      description: NAM A2 runtime library (parser, engine, SIMD backends, tests)
      ai_involvement: written by the AI agent, reviewed by the maintainer, verified against the upstream reference
      tools_used: [Claude Code]
    - name: scripts/download_assets.py
      description: Test asset downloader (public demo audio, upstream models, TONE3000 API)
      ai_involvement: written by the AI agent, reviewed by the maintainer
      tools_used: [Claude Code]
    - name: crates/robine-nam/tests/fixtures
      description: Upstream example model and golden vectors
      ai_involvement: golden vectors generated by running the upstream reference through robine-wavelab, not by an AI model

data_handling:
  data_classification: public
  categories_sent:
    - source code of this repository
    - build and test output
    - public documentation of NeuralAmpModelerCore and the TONE3000 API
  personal_data_sent: false

declaration:
  date: "2026-10-10"
  declared_by: Guillaume Bailleul
  notes: >-
    Percentages are a self-assessment of the authorship of the text in this
    repository (vendored third-party code excluded). Update this file when
    the pattern of AI usage changes, not on every commit.
