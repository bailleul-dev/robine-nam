# Measurement tooling for robine-nam. This is a standalone workspace so it can
# be moved to its own repository: the only link to the library is the path
# dependency in nam-lab/Cargo.toml.
[workspace]
resolver = "2"
members = ["nam-reference-sys", "nam-lab"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
