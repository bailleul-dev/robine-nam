[package]
name = "nam-lab"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Measurement CLI for NAM A2 runtimes: render, delta vs upstream reference, quality metrics, performance"

[[bin]]
name = "nam-lab"
path = "src/main.rs"

[dependencies]
# The library under test. Switch to a crates.io version when this workspace
# is extracted.
robine-nam = { path = "../../crates/robine-nam" }
nam-reference-sys = { path = "../nam-reference-sys" }
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
realfft = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
